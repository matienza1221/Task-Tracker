# Project Tracker — production nginx (TLS termination + SPA + /api proxy)

upstream tracker_api {
    server api:4000;
    keepalive 32;
}

# Body size matches MAX_UPLOAD_MB (10 MB) plus multipart overhead.
client_max_body_size 12m;

server {
    listen 80;
    server_name _;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Generated by scripts/generate-certs.sh (development) or replaced with real
    # certificates in production. Never commit certificate material.
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Default headers for this server (locations that set their own add_header
    # must include the snippet instead — see security-headers.conf).
    include /etc/nginx/snippets/security-headers.conf;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://tracker_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
    }
}
