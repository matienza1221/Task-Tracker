# ---------------------------------------------------------------------------
# TeamBoard — production stack (standalone file)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# - nginx terminates TLS on 443 and proxies /api to the API container
# - the API and database are not published on the host
# - `migrate` applies migrations and seeds base data before the API starts
# ---------------------------------------------------------------------------
name: ${COMPOSE_PROJECT_NAME:-teamboard}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-teamboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [teamboard-net]

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-teamboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamboard}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_PROJECT_CODE: ${SEED_PROJECT_CODE:-WEBAPP}
      SEED_TIMEZONE: ${SEED_TIMEZONE:-Asia/Manila}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks: [teamboard-net]

  api:
    build:
      context: ./backend
      target: prod
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-teamboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamboard}?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-teamboard_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-teamboard_csrf}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
      COOKIE_SECURE: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      APP_URL: ${APP_URL:-https://localhost}
      TRUST_PROXY: 'true'
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-3}
      ENABLE_PUBLIC_REGISTRATION: 'false'
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      UPLOAD_DIR: /app/uploads
      STORAGE_PROVIDER: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [teamboard-net]

  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [teamboard-net]

volumes:
  pgdata:
    name: teamboard_pgdata
  uploads:
    name: teamboard_uploads

networks:
  teamboard-net:
    name: teamboard-net
    driver: bridge
