# ---------------------------------------------------------------------------
# TeamBoard — development stack
#   docker compose up --build
#   Web:  http://localhost:5180
#   API:  http://localhost:4000/api/health
# ---------------------------------------------------------------------------
name: teamboard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-teamboard}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [teamboard-net]

  api:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-teamboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamboard}?schema=public
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-teamboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamboard}_test?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-teamboard_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-teamboard_csrf}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5180,https://localhost:5180}
      APP_URL: ${APP_URL:-http://localhost:5180}
      TRUST_PROXY: 'true'
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-3}
      ENABLE_PUBLIC_REGISTRATION: ${ENABLE_PUBLIC_REGISTRATION:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      UPLOAD_DIR: /app/uploads
      STORAGE_PROVIDER: local
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_PROJECT_CODE: ${SEED_PROJECT_CODE:-WEBAPP}
      SEED_TIMEZONE: ${SEED_TIMEZONE:-Asia/Manila}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
    # `npm ci` keeps the named node_modules volume in sync with the lockfile so
    # adding a dependency never leaves the container with stale modules.
    command: sh -c "npm ci --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./certs:/certs:ro
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [teamboard-net]

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:4000
      # Serve plain HTTP in Docker; HTTPS requires the browser to trust the
      # self-signed cert, which is not the case for http://localhost.
      VITE_DEV_HTTPS: 'false'
    # Source is bind-mounted and hot-reloaded by Vite (polling is enabled in
    # vite.config.ts). `npm ci` keeps the named node_modules volume in sync with
    # the lockfile, so dependency changes never require `docker compose --build`.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '${WEB_PORT:-5180}:5180'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [teamboard-net]

volumes:
  pgdata:
    name: teamboard_pgdata
  backend_node_modules:
    name: teamboard_backend_node_modules
  frontend_node_modules:
    name: teamboard_frontend_node_modules

networks:
  teamboard-net:
    name: teamboard-net
    driver: bridge
