# Continuous integration: typecheck, tests and production builds for both apps.
# Backend tests run against a real PostgreSQL service (see ARCHITECTURE.md §12).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamboard
          POSTGRES_PASSWORD: teamboard_ci_password
          POSTGRES_DB: teamboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teamboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://teamboard:teamboard_ci_password@localhost:5432/teamboard?schema=public
          DATABASE_URL_TEST: postgresql://teamboard:teamboard_ci_password@localhost:5432/teamboard_test?schema=public
          LOG_LEVEL: silent
          COOKIE_SECURE: 'false'
          UPLOAD_DIR: ./.test-uploads
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Fail on secrets in the bundle
        working-directory: .
        run: |
          if grep -rEli "DATABASE_URL|POSTGRES_PASSWORD|SEED_ADMIN_PASSWORD|JWT_SECRET|BEGIN (RSA|OPENSSH) PRIVATE KEY" frontend/dist; then
            echo "::error::A backend secret pattern was found in the frontend bundle."
            exit 1
          fi
